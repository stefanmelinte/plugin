name: Verify Momentum Music Intel macOS

on:
  pull_request:
    branches: [main]
    paths:
      - "payload-v3/**"
      - ".github/workflows/build-momentum-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-intel-macos:
    name: Verify and build Mac Intel x64
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: "-"
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Check out build workspace
        uses: actions/checkout@v4

      - name: Check out Zuno 1.4.0
        uses: actions/checkout@v4
        with:
          repository: noFAYZ/zuno
          ref: v1.4.0
          path: app
          fetch-depth: 0

      - name: Rebuild and verify Momentum Music patch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import urllib.request
          from pathlib import Path

          payload_dir = Path("payload-v3")
          prefix_parts = [payload_dir / f"momentum-music.patch.xz.b64.{index:03d}" for index in range(3)]
          suffix_part = payload_dir / "momentum-music.patch.xz.b64.004"
          if any(not part.exists() for part in [*prefix_parts, suffix_part]):
              raise SystemExit("Momentum Music payload is incomplete")

          prefix = "".join(part.read_text().strip() for part in prefix_parts)
          suffix = suffix_part.read_text().strip()

          request = urllib.request.Request(
              "https://api.github.com/repos/stefanmelinte/plugin/git/blobs/ca273597bd7f851e7ebe15b05bfb961130af4710",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              old_blob = json.load(response)
          middle = base64.b64decode(old_blob["content"]).decode("ascii")
          if len(middle) != 12_000:
              raise SystemExit(f"Unexpected middle chunk length: {len(middle)}")

          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          expected_compressed_hex = "dd2e53fbebdfc736141f0c515c79419d8cadfcd3b978013d2e9fb7a276240a51"
          expected_compressed = bytes.fromhex(expected_compressed_hex)
          expected_patch = "cc5c39204890d7b9068001912377145802157d197c666020c5bf9fdf54ac3d48"

          encoded = prefix + middle + suffix
          compressed = bytearray(base64.b64decode(encoded, validate=True))
          current_hash = hashlib.sha256(compressed).hexdigest()
          print(f"Encoded characters: {len(encoded)}")
          print(f"Current compressed SHA-256: {current_hash}")

          if current_hash != expected_compressed_hex:
              # Search for one copied Base64 character anywhere in the payload. Replacing one
              # character changes just three decoded bytes, so each candidate requires only a
              # SHA-256 over the already-decoded 41 KB buffer, not another Base64 decode.
              found = None
              for global_position, original in enumerate(encoded):
                  if original == "=":
                      continue
                  quartet_start = global_position - (global_position % 4)
                  quartet = list(encoded[quartet_start:quartet_start + 4])
                  byte_start = (quartet_start // 4) * 3
                  original_bytes = bytes(compressed[byte_start:byte_start + 3])

                  for candidate in alphabet:
                      if candidate == original:
                          continue
                      changed = quartet.copy()
                      changed[global_position - quartet_start] = candidate
                      try:
                          replacement = base64.b64decode("".join(changed), validate=True)
                      except Exception:
                          continue
                      compressed[byte_start:byte_start + len(replacement)] = replacement
                      if hashlib.sha256(compressed).digest() == expected_compressed:
                          found = (global_position, original, candidate, bytes(compressed))
                          break
                  if found:
                      break
                  compressed[byte_start:byte_start + 3] = original_bytes
                  if global_position and global_position % 10_000 == 0:
                      print(f"Checked {global_position} encoded positions")

              if found is None:
                  raise SystemExit("Could not recover a single copied character in the Momentum Music payload")

              position, original, candidate, corrected = found
              compressed = bytearray(corrected)
              print(f"Recovered payload at global offset {position}: {original!r} -> {candidate!r}")

          if hashlib.sha256(compressed).hexdigest() != expected_compressed_hex:
              raise SystemExit("Recovered compressed payload does not match its trusted SHA-256")

          patch = lzma.decompress(bytes(compressed))
          patch_hash = hashlib.sha256(patch).hexdigest()
          if patch_hash != expected_patch:
              raise SystemExit(f"Unexpected patch SHA-256: {patch_hash}")
          Path("/tmp/momentum-music.patch").write_bytes(patch)
          print(f"Verified {len(patch)} byte Momentum Music patch")
          PY

      - name: Apply Momentum Music changes
        shell: bash
        run: |
          set -euo pipefail
          cd app
          git apply --index /tmp/momentum-music.patch
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Generate Momentum app icons
        working-directory: app
        run: npx tauri icon assets/img/momentum/app-icon.png

      - name: Type-check
        working-directory: app
        run: npm run typecheck

      - name: Run source checks
        working-directory: app
        run: npm run check

      - name: Build Intel macOS application and DMG
        working-directory: app
        run: npx tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: Verify DMG, signature, and Intel application binary
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          dmg_path="$(find "$bundle_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -quiet
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          file "$app_path/Contents/MacOS/$executable" | tee /tmp/momentum-architecture.txt
          grep -q 'x86_64' /tmp/momentum-architecture.txt
          codesign --verify --deep --strict "$app_path"

      - name: Prepare verified installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg_path="$(find app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          cp "$dmg_path" dist/Momentum_Music_1.0.0_x64.dmg
          shasum -a 256 dist/Momentum_Music_1.0.0_x64.dmg > dist/Momentum_Music_1.0.0_x64.dmg.sha256

      - name: Upload verified Intel installer
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-Music-1.0.0-Mac-Intel
          path: dist/*
          if-no-files-found: error
          retention-days: 14
